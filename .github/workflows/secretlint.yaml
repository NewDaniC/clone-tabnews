name: Secretlint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secretlint:
    name: Secretlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/hydrogen"

      - run: npm ci

      - run: npx --no-install secretlint --maskSecrets "**/*"
